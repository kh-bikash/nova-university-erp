<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    
    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;family=Noto+Serif:wght@700&amp;family=JetBrains+Mono&amp;display=swap');

    .title {
      font-family: 'Noto Serif', serif;
      font-weight: 700;
      fill: #FFFFFF;
      font-size: 38px;
    }
    
    .subtitle {
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      fill: url(#primaryGrad);
      font-size: 16px;
      letter-spacing: 6px;
      text-transform: uppercase;
    }
    
    .badge-text {
      font-family: 'JetBrains Mono', monospace;
      fill: #94A3B8;
      font-size: 12px;
    }

    /* Animations */
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.8; transform: scale(1.02); }
      100% { opacity: 0.3; transform: scale(0.98); }
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
      100% { transform: translateY(0px); }
    }

    @keyframes draw {
      to { stroke-dashoffset: 0; }
    }

    .spin-layer {
      animation: spin 20s linear infinite;
      transform-origin: 100px 120px;
    }

    .spin-layer-reverse {
      animation: spin 15s linear infinite reverse;
      transform-origin: 100px 120px;
    }

    .pulse-glow {
      animation: pulse 4s ease-in-out infinite;
      transform-origin: 100px 120px;
    }

    .floating-logo {
      animation: float 6s ease-in-out infinite;
    }

    .draw-line {
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: draw 3s ease-out forwards;
    }
  </style>

  <!-- Background -->
  <rect width="800" height="240" rx="8" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Grid decoration -->
  <g opacity="0.1">
    <path d="M 0,40 H 800 M 0,80 H 800 M 0,120 H 800 M 0,160 H 800 M 0,200 H 800" stroke="#94A3B8" stroke-width="0.5" />
    <path d="M 80,0 V 240 M 160,0 V 240 M 240,0 V 240 M 320,0 V 240 M 400,0 V 240 M 480,0 V 240 M 560,0 V 240 M 640,0 V 240 M 720,0 V 240" stroke="#94A3B8" stroke-width="0.5" />
  </g>

  <!-- Glowing logo orb -->
  <g class="floating-logo">
    <circle cx="100" cy="120" r="70" fill="#1E3A5F" opacity="0.4" />
    <circle cx="100" cy="120" r="50" fill="#2563EB" opacity="0.1" class="pulse-glow" />
    
    <!-- Rotating Tech Rings -->
    <circle cx="100" cy="120" r="45" fill="none" stroke="url(#primaryGrad)" stroke-width="1.5" stroke-dasharray="120 40 20 40" class="spin-layer" />
    <circle cx="100" cy="120" r="38" fill="none" stroke="#64748B" stroke-width="1" stroke-dasharray="80 20 10 30" class="spin-layer-reverse" />
    <circle cx="100" cy="120" r="55" fill="none" stroke="#2563EB" stroke-width="0.75" stroke-dasharray="10 10" class="spin-layer" />

    <!-- Center Crest -->
    <g transform="translate(80, 100)">
      <polygon points="20,5 35,12 35,28 20,35 5,28 5,12" fill="#1E3A5F" stroke="url(#primaryGrad)" stroke-width="2" />
      <text x="20" y="24" font-family="'Noto Serif', serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">NU</text>
    </g>
  </g>

  <!-- Title Text Section -->
  <g transform="translate(200, 105)">
    <!-- Subtitle (Tracking/Accent) -->
    <text x="0" y="-25" class="subtitle">Next-Gen University ERP</text>

    <!-- Main Title -->
    <text x="0" y="20" class="title">Nova University System</text>

    <!-- Horizontal divider -->
    <line x1="0" y1="40" x2="520" y2="40" stroke="#334155" stroke-width="1.5" class="draw-line" />
    
    <!-- Meta/Specs Badge -->
    <g transform="translate(0, 65)">
      <rect width="140" height="22" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="10" y="15" class="badge-text" font-weight="bold">CorpScale v1.4</text>

      <rect x="150" width="160" height="22" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="160" y="15" class="badge-text" font-weight="bold">Neon PostgreSQL</text>

      <rect x="320" width="130" height="22" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="330" y="15" class="badge-text" font-weight="bold">Vercel Deploy</text>
    </g>
  </g>
</svg>
